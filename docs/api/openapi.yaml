openapi: 3.1.0
info:
  title: Team Task Tracker API
  version: 0.1.0
  summary: REST API of the Team Task Tracker. Health and authentication exist so far.
  description: |
    OpenAPI 3.1 document for the endpoints of docs/SDS.md section 4. The backend serves it as
    Swagger UI at `/api/docs` and as JSON at `/api/docs/openapi.json` when `API_DOCS_ENABLED`
    is true.

    **Errors.** Every non-2xx response has the same body,
    `{ "error": { "code", "message", "details?", "requestId" } }`, with the codes of
    docs/SDS.md section 4.2. The executable contracts are the Zod schemas in `packages/shared`;
    a test fails if a registered route is missing here. Each feature ticket adds its paths.
servers:
  - url: /api
    description: Same-origin API base path
tags:
  - name: health
    description: Liveness check.
  - name: auth
    description: Registration, login, refresh-token rotation, logout and the current user.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns 200 while the process is serving requests. It does not query the database.
      tags: [health]
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      description: Creates the user (Argon2id hash), returns the access token and sets the `refresh_token` cookie.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          $ref: '#/components/responses/AuthSession'
        '409':
          description: The email is already registered (`EMAIL_TAKEN`, compared case-insensitively).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: Returns the access token and sets the `refresh_token` cookie.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401':
          description: Unknown email or wrong password, with an identical body (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token
      description: |
        Reads the `refresh_token` cookie (there is no request body), rotates it and returns a new
        access token. The `Origin` header must equal `APP_ORIGIN`. Presenting an already rotated
        token revokes all tokens of the user.
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401':
          description: Cookie missing, unknown, expired, revoked or reused (`UNAUTHORIZED`); the cookie is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revokes the presented refresh token and clears the cookie. Idempotent. The `Origin` header must equal `APP_ORIGIN`.
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Logged out; the cookie is expired.
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getMe
      summary: Current user
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived (15 min) access token returned by register, login and refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly rotating refresh token. The browser sends it by itself.
  responses:
    AuthSession:
      description: The user and an access token. The `refresh_token` cookie is set (HttpOnly, SameSite=Strict, Path=/api/auth, 7 days, Secure when configured).
      headers:
        Set-Cookie:
          description: The rotating `refresh_token` cookie.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    ValidationError:
      description: Invalid input (`VALIDATION_ERROR`) with `details` naming each field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired access token (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenOrigin:
      description: The `Origin` header is not the application origin (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error (`INTERNAL_ERROR`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased by the server.
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        accessToken:
          type: string
          description: "HS256 JWT, 15 minutes. Keep it in memory and send it as `Authorization: Bearer`."
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on `message`.
      enum:
        - VALIDATION_ERROR
        - MALFORMED_JSON
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - ROUTE_NOT_FOUND
        - EMAIL_TAKEN
        - CONFLICT
        - INVALID_STATUS_TRANSITION
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the invalid field, for example `assigneeId`.
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: Echo of the `X-Request-Id` response header.
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
